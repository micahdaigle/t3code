# Fork-only: upstream CI runs on paid Blacksmith runners a fork can't use, and the
# remote-coding server is too small to typecheck the web app. This runs the web
# checks on GitHub-hosted runners for every push to a `micah/**` branch.
name: Fork check

on:
  push:
    branches:
      - "micah/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck web
        run: vp run --filter @t3tools/web typecheck

      - name: Lint web
        run: vp lint --report-unused-disable-directives apps/web

      - name: Format check
        run: vp fmt --check apps/web

      - name: Test web
        run: vp run --filter @t3tools/web test
